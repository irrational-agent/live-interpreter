[package]
name = "live-interpreter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
cpal = "0.18.2"
dotenvy = "0.15.7"
futures-util = "0.3.34"
hound = "3.5.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "stream", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
