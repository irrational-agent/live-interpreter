[package]
name = "live-interpreter"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
cpal = "0.18.2"
dotenvy = "0.15.7"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
futures-util = "0.3.34"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
raw-window-handle = "0.6.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "stream", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
